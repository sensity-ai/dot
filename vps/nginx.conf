server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Portal - payment page
    location / {
        root /var/www/portal;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Model downloads - protected by API key
    location /models/ {
        internal;  # Only accessible via auth_request passthrough
        alias /var/www/models/;
    }

    # Public model request endpoint
    location /download/ {
        auth_request /api/validate;
        auth_request_set $key $upstream_http_x_api_key;
        proxy_pass http://backend/models/;
        proxy_set_header X-API-Key $key;
    }

    # API endpoints
    location /api/validate {
        internal;
        proxy_pass http://127.0.0.1:5000/api/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/webhook/lemonsqueezy {
        proxy_pass http://127.0.0.1:5000/api/webhook/lemonsqueezy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
