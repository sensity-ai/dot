---
# M2 8GB Balanced Configuration (RECOMMENDED)
# Medium-High Quality + Stable Performance
# Target: ~2-3 FPS with excellent face quality
# No restoration model: keep the live path small and stable.

swap_type: simswap
parsing_model_path: saved_models/simswap/parsing_model/checkpoint/79999_iter.pth
arcface_model_path: saved_models/simswap/arcface_model/arcface_checkpoint.tar
checkpoints_dir: saved_models/simswap/checkpoints

# QUALITY: 512 for highest quality face matching (vs 224 for lower quality)
crop_size: 512

# MEMORY OPTIMIZATION for 8GB
use_fp16: false                   # Set to true for even more memory savings
use_mask: true                    # Enable face mask blending for seamless integration
use_cam: true                     # Real-time camera input mode

# RUNTIME TUNING
batch_size: 1                     # Process one face at a time
cache_frames: false               # Don't buffer frames in memory
preload_models: false             # Load models on-demand
enable_memory_pooling: true       # Reuse GPU memory across batches

# DETECTION
detection_threshold: 0.6          # Good balance: catches faces, reduces false positives
face_size_threshold: 20           # Skip faces smaller than 20px (noise reduction)
max_num_faces: 1                  # One face keeps 8GB systems stable

# QUALITY: natural rendering pipeline
natural_color_match: true
natural_color_match_strength: 0.90
natural_detail_enhance: true
natural_detail_enhance_strength: 0.10
natural_preserve_occluders: true
natural_occluder_threshold: 0.10
natural_occluder_strength: 0.90
natural_blend_mode: alpha
natural_blend_strength: 0.88
natural_mask_blur: 25
